# Publie la page de présentation (docs/presentation) sur GitHub Pages.
# Seul ce dossier est mis en ligne : le reste de docs/ (spécifications, plans) n'est pas publié.
name: Page de présentation

on:
  push:
    branches: [main]
    paths:
      - "docs/presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r docs/presentation/assets _site/assets
          cp docs/presentation/FlashGet-presentation.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
