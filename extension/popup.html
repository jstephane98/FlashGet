<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>body{width:320px}</style>
  </head>
  <body>

    <!-- Header -->
    <div class="head">
      <div class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></div>
      <span class="brand">FlashGet</span>
      <div class="status" style="margin-left:auto">
        <span id="dot" class="dot off"></span>
        <span id="statusText">…</span>
      </div>
    </div>

    <!-- Main body -->
    <div class="body">

      <!-- Connected view -->
      <div id="connectedView" class="hidden">
        <button id="downloadVideo" class="fg-cta"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="popupDownloadVideo">Download the video on this page</span></button>
        <div id="toast"></div>

        <p id="staleNotice" class="stale hidden" data-i18n="popupStaleNotice">The extension was updated. Reload it from the browser's extensions page (the ⟳ button on FlashGet), then reopen this window.</p>

        <div id="siteRow" class="site-row hidden">
          <svg id="siteBan" class="ic hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
          <div class="tx"><b data-i18n="popupAutoCapture">Automatic capture</b><small id="siteText"></small></div>
          <button id="siteSwitch" class="sw" role="switch" aria-checked="true" aria-label="Automatic capture on this site" data-i18n-aria-label="popupAutoCaptureAria"></button>
        </div>

        <div class="url-section-label" data-i18n="popupUrlSection">Download a file by URL</div>
        <input id="url" class="fg-input" type="text" placeholder="Paste a URL…" data-i18n-placeholder="popupUrlPlaceholder" />
        <button id="sendUrl" class="fg-btn" data-i18n="popupSend">Send</button>
      </div>

      <!-- Disconnected view -->
      <div id="disconnectedView" class="hidden">
        <p id="disconnectedText" class="note-text" data-i18n="popupOffline">FlashGet isn't running. Open the app, then try again.</p>
        <button id="openOptions" class="fg-btn" data-i18n="popupOptions">Options</button>
        <button id="retry" class="fg-btn" data-i18n="popupRetry">Retry</button>
      </div>

    </div>

    <script src="i18n.js" type="module"></script>
    <script src="popup.js" type="module"></script>
  </body>
</html>
