<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>body{max-width:420px;margin:24px auto;padding:0 16px}</style>
  </head>
  <body>

    <h3>Options FlashGet</h3>

    <label class="options-label" for="token">Jeton d'appairage (copié depuis l'application)</label>
    <input id="token" class="fg-input" type="text" placeholder="Coller le jeton…" />

    <label class="options-label" for="port">Port</label>
    <input id="port" class="fg-input" type="number" value="15151" />

    <label class="options-checkbox-row">
      <input id="autoCapture" type="checkbox" />
      Capture automatique des téléchargements
    </label>

    <label class="options-label" for="captureTypes">Types capturés (extensions, séparées par des virgules)</label>
    <textarea id="captureTypes" class="fg-input fg-mono" rows="4"></textarea>

    <div style="display:flex;align-items:center;margin-top:16px">
      <button id="save" class="fg-cta" style="width:auto;padding:10px 24px">Enregistrer</button>
      <span id="saved"></span>
    </div>

    <script src="options.js" type="module"></script>
  </body>
</html>
